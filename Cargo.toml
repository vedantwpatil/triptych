[package]
name = "triptych"
version = "0.1.0"
publish = false
edition = "2024"
description = "Keyboard-driven terminal todo list, weekly calendar and email client with natural-language input"

[dependencies]
sqlx = { version = "0.8", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "chrono",
  "migrate",
] }
chrono = { version = "0.4", features = ["serde"] }
chrono-english = "0.1"
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.11"
regex = "1.0"
nom = "7"
once_cell = "1.19"
lru = "0.16.1"
anyhow = "1.0"
dotenvy = "0.15"
clap = { version = "4.5.48", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26.4"
rustls-native-certs = "0.8.4"
mail-parser = { version = "0.11.5", features = ["full_encoding"] }

icalendar = { version = "0.17.4", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
calendar-sync = ["icalendar"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
